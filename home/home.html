<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Tarefas</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <main class="task-app">
        <header class="page-header">
            <div>
                <p class="eyebrow">ORGANIZAÇÃO PESSOAL</p>
                <h1>Minhas tarefas</h1>
                <p class="subtitle">Adicione, acompanhe e conclua suas atividades.</p>
            </div>
            <div class="task-summary" aria-live="polite">
                <strong id="totalTarefas">0</strong>
                <span>tarefas</span>
            </div>
        </header>

        <section class="task-panel" aria-labelledby="taskHeading">
            <div class="panel-header">
                <div>
                    <h2 id="taskHeading">Lista de tarefas</h2>
                    <p id="emptyHint">Suas novas tarefas aparecerão aqui.</p>
                </div>
            </div>

            <div id="listaTarefas" class="task-list" aria-live="polite">
                <p class="empty-state">Nenhuma tarefa adicionada ainda.</p>
            </div>

            <form id="formTarefa" class="task-form">
                <label class="sr-only" for="nomeTarefa">Nome da tarefa</label>
                <input id="nomeTarefa" type="text" placeholder="Digite o nome da tarefa..." autocomplete="off" required>

                <div class="form-fields">
                    <label class="field-label">
                        <span>Data de vencimento</span>
                        <input id="dataTarefa" type="date" required>
                    </label>
                    <label class="field-label">
                        <span>Horário</span>
                        <input id="horarioTarefa" type="time" required>
                    </label>
                    <button class="add-button" type="submit" aria-label="Adicionar tarefa">+</button>
                </div>
            </form>
        </section>
    </main>
    <script src="home.js"></script>
</body>
</html>

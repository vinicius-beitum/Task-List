<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Gerenciador</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <main class="app-shell">
        <aside class="sidebar" aria-label="Navegação principal">
            <div class="profile"><div class="avatar" aria-hidden="true">M</div><div><strong>Marcos</strong><small>Conta Pessoal</small></div></div>
            <nav class="navigation">
                <div class="brand"><span class="brand-icon">✓</span> MEU GERENCIADOR</div>
                <button class="nav-link active" type="button" data-view="today"><span class="nav-icon">▦</span>Meu Dia</button>
                <button class="nav-link" type="button" data-view="inbox"><span class="nav-icon">▤</span>Caixa de Entrada <b id="navPending">4</b></button>
                <button class="nav-link" type="button" data-view="week"><span class="nav-icon">□</span>Próximos 7 Dias</button>
                <button class="nav-link" type="button" data-view="completed"><span class="nav-icon">✓</span>Concluídos</button>
            </nav>
            <p class="sidebar-status"><span></span>Sincronizado localmente</p>
        </aside>
        <section class="content" aria-labelledby="pageTitle">
            <header class="page-header">
                <div><p class="eyebrow" id="currentDate">TERÇA-FEIRA, 15 DE SETEMBRO</p><h1 id="pageTitle">Minhas Tarefas</h1><p class="subtitle">Tudo o que importa, em um só lugar.</p></div>
                <div class="pending-counter" aria-live="polite"><strong id="pendingTasks">4</strong><span>pendentes</span></div>
            </header>
            <section class="tasks-container" aria-labelledby="sectionTitle">
                <header class="tasks-header"><div><h2 id="sectionTitle">Hoje</h2><p>Suas tarefas ativas</p></div><span class="task-count" id="totalTasks">4 tarefas</span></header>
                <div id="taskList" class="task-list" aria-live="polite"></div>
                <form class="task-form" id="taskForm">
                    <label class="sr-only" for="taskInput">Nome da tarefa</label>
                    <input id="taskInput" type="text" placeholder="Adicionar uma nova tarefa..." autocomplete="off" required>
                    <div class="form-actions"><label class="date-control" for="taskDate"><span aria-hidden="true">◷</span><span id="dateLabel">Definir data e hora</span></label><input id="taskDate" type="datetime-local" aria-label="Data e hora de vencimento"><button type="submit">Adicionar</button></div>
                </form>
            </section>
        </section>
    </main>
    <script src="home.js"></script>
</body>
</html>

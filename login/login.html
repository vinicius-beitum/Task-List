<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    
<main class="container">

    <div class="welcome">

    <h2>Bem-vindo de volta!</h2>

    <p>
        Faça login para continuar acessando sua conta
        e aproveitar todos os recursos.
    </p>

    <i class="fa-solid fa-shield-halved"></i>

</div>

    <form id="loginForm" action="../home/home.html" method="get">

        <h1>Entrar na sua conta </h1>

            <div class="input-mail">
                <input type="email"  id="email" placeholder="Digite seu Email">
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="input-password">
                <input type="password"  id="senha" placeholder="Digite uma senha">
                <i class="fa-solid fa-lock"></i>
            </div>

            <div class="remember-password">

                <label for="">
                    <input type="checkbox" id="lembrar">
                    Lembrar minha senha
                </label>

                <a href="#">Esqueci minha senha</a>
            </div>

            <div class="button-login">
                <button type="submit">Login</button>
            </div>

            <div class="register">
                <p>Não tenho uma conta <a href="">Cadastre-se</a></p>
            </div>
    </form>

</main>
<script src="login.js"></script>
</body>
</html>

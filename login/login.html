<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre no TaskFlow e organize suas tarefas, pastas e prazos.">
    <title>Entrar · TaskFlow</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../shared/base.css">
    <link rel="stylesheet" href="auth.css">
    <script type="module" src="login.js"></script>
</head>
<body>
    <main class="auth-card">
        <section class="auth-hero">
            <div class="auth-hero-content">
                <div class="auth-hero-icon" aria-hidden="true"><i class="fa-solid fa-list-check"></i></div>
                <h2 class="auth-hero-title">Bem-vindo <span>de volta</span></h2>
                <p class="auth-hero-text">
                    Suas tarefas, pastas e prazos sincronizados em qualquer dispositivo.
                </p>
                <ul class="auth-highlights">
                    <li><i class="fa-solid fa-check" aria-hidden="true"></i>Prazos e prioridades</li>
                    <li><i class="fa-solid fa-check" aria-hidden="true"></i>Pastas por cor</li>
                    <li><i class="fa-solid fa-check" aria-hidden="true"></i>Sincronização em tempo real</li>
                </ul>
            </div>
            <span class="decor decor-1" aria-hidden="true"></span>
            <span class="decor decor-2" aria-hidden="true"></span>
            <span class="decor decor-3" aria-hidden="true"></span>
        </section>

        <form class="auth-form" id="login-form" novalidate>
            <header class="auth-form-header">
                <h1 id="login-title">Entrar na sua conta</h1>
                <p class="auth-form-subtitle" id="remembered-email" hidden></p>
            </header>

            <p class="form-alert" id="form-alert" role="alert" hidden></p>

            <div class="field">
                <label class="sr-only" for="email">E-mail</label>
                <input class="field-input" type="email" id="email" name="email" placeholder="Seu e-mail"
                    autocomplete="username" inputmode="email" aria-describedby="email-error" autofocus required>
                <i class="fa-solid fa-envelope field-icon" aria-hidden="true"></i>
            </div>
            <p class="field-error" id="email-error" aria-live="polite"></p>

            <button class="link-button switch-account" id="switch-account" type="button" hidden>
                <i class="fa-solid fa-arrow-right-arrow-left" aria-hidden="true"></i>Usar outra conta
            </button>

            <div class="field">
                <label class="sr-only" for="password">Senha</label>
                <input class="field-input" type="password" id="password" name="password" placeholder="Sua senha"
                    autocomplete="current-password" aria-describedby="password-error caps-lock-warning" required>
                <button class="field-action" type="button" aria-controls="password" aria-label="Mostrar senha" aria-pressed="false">
                    <i class="fa-solid fa-eye" aria-hidden="true"></i>
                </button>
            </div>
            <p class="caps-lock-warning" id="caps-lock-warning" hidden>
                <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>Caps Lock está ativado.
            </p>
            <p class="field-error" id="password-error" aria-live="polite"></p>

            <div class="form-row">
                <label class="checkbox">
                    <input type="checkbox" id="remember" name="remember">
                    Manter conectado
                </label>
                <a class="text-link" href="recuperar.html">Esqueci minha senha</a>
            </div>

            <button class="primary-button" type="submit">Entrar</button>

            <div class="divider"><span>ou</span></div>

            <button class="social-button" id="google-sign-in" type="button">
                <i class="fa-brands fa-google" aria-hidden="true"></i>Continuar com Google
            </button>

            <p class="auth-switch">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        </form>
    </main>
</body>
</html>

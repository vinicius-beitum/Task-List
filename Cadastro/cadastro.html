<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>

<main class="container">

    <div class="welcome">

        <h2>Bem-vindo!</h2>
            <p>
                Crie sua conta para acessar todos os recursos
                e aproveitar ao máximo nossa plataforma.
            </p>

        <i class="fa-solid fa-user-plus"></i>
    
    </div>

    <div class="input-name">
        <input type="text" id="nome" placeholder="Digite seu nome">
    </div>

    <div class="input-mail">
        <input type="email" id="email" placeholder="Digite seu Email">
    </div>

    <div class="input-senha">
        <input type="password" id="senha" placeholder="Digite uma senha">
        <input type="password" id="confirmarSenha" placeholder="Confirme sua senha">
    </div>

    <label for="">
        <input type="checkbox" id="termos">
        Aceito os termos e condições
    </label>




</main>
    
</body>
</html>
